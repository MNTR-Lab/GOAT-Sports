
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOAT Sports | CRM</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#20253a;background:#f4f6f9}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}.layout{display:flex;min-height:100vh}.sidebar{width:254px;background:#683695;color:#fff;padding:26px 16px;display:flex;flex-direction:column;gap:6px}.brand{font-size:24px;font-weight:850;letter-spacing:.3px;padding:10px 12px 24px}.brand small{display:block;font-size:12px;opacity:.8;font-weight:500;letter-spacing:2px}.nav{border:0;background:transparent;color:#f8f3fc;text-align:left;padding:13px 16px;border-radius:10px;font-weight:600}.nav:hover,.nav.active{background:#109488;color:#fff}.sidebar footer{margin-top:auto;padding:14px 12px;font-size:12px;opacity:.85}.main{flex:1;min-width:0}.top{background:white;padding:22px 30px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e8e8ef}.top h1{margin:0;font-size:22px}.top span{font-size:13px;color:#637080}.content{padding:30px;max-width:1400px;margin:auto}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.card,.panel{background:white;border:1px solid #e6e8ef;border-radius:16px;padding:24px;box-shadow:0 4px 16px #18283e08}.card strong{font-size:30px;display:block;margin-top:14px;color:#683695}.muted{color:#677185}.panel{margin-top:22px}.panel h2{margin-top:0}.tag{display:inline-block;background:#e8f7f3;color:#0d756c;padding:5px 10px;border-radius:20px;font-size:12px;font-weight:700}.warn{background:#fff3e4;color:#9b611b}.btn{background:#109488;color:white;border:0;border-radius:9px;padding:12px 18px;font-weight:700}.btn.secondary{background:#683695}.btn.outline{background:white;color:#683695;border:1px solid #d3c3e1}.login{min-height:100vh;display:grid;place-items:center;padding:22px;background:linear-gradient(135deg,#683695,#35245a)}.login .panel{max-width:430px;width:100%;margin:0;padding:34px}.login h1{color:#683695;margin:0 0 6px}.field{display:block;margin:17px 0}.field span{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input{width:100%;border:1px solid #cbd0da;border-radius:9px;padding:13px}.login button{width:100%}.error{color:#b72e39;font-size:13px;min-height:18px}.list{display:grid;gap:12px;margin-top:20px}.list>div{border:1px solid #e9ebef;padding:15px;border-radius:10px}.status{margin-top:14px;font-size:13px;color:#586477}a{color:#683695}@media(max-width:850px){.layout{display:block}.sidebar{width:100%;padding:12px;display:flex;flex-direction:row;flex-wrap:wrap}.brand{width:100%;padding:6px}.sidebar footer{display:none}.nav{font-size:12px;padding:9px}.cards{grid-template-columns:repeat(2,1fr)}.content{padding:15px}.top{padding:18px}}@media(max-width:520px){.cards{grid-template-columns:1fr}}
</style></head><body>
<section id="login" class="login"><form class="panel" id="loginForm"><h1>GOAT Sports</h1><p class="muted">Secure CRM administrator login</p><label class="field"><span>Email</span><input id="email" type="email" autocomplete="username" required></label><label class="field"><span>Password</span><input id="password" type="password" autocomplete="current-password" required></label><p class="error" id="loginError" role="alert"></p><button class="btn" type="submit">Sign in</button><p class="status">Only authorized GOAT Sports CRM users can access this system.</p></form></section>
<section id="app" class="layout hidden"><aside class="sidebar"><div class="brand">GOAT SPORTS<small>OPERATIONS CRM</small></div><button class="nav active" data-page="dashboard">Dashboard</button><button class="nav" data-page="clients">Clients</button><button class="nav" data-page="leads">Leads</button><button class="nav" data-page="quotes">Quotes</button><button class="nav" data-page="jobs">Jobs & Production</button><button class="nav" data-page="artwork">Artwork</button><button class="nav" data-page="employees">Employees & Tasks</button><button class="nav" data-page="revenue">Revenue & Tax</button><button class="nav" data-page="locker">GOAT Locker</button><footer>GOAT Sports • MNTR+ CRM architecture</footer></aside><div class="main"><header class="top"><div><h1 id="pageTitle">Dashboard</h1><span>GOAT Sports organization workspace</span></div><button class="btn outline" id="signout">Sign out</button></header><main class="content" id="view"></main></div></section>
<script>
'use strict';
// Public Supabase anon key only. Never place a service_role key in browser HTML.
const SB_URL='https://lbheezjanvalalinqxcd.supabase.co';
const SB_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxiaGVlemphbnZhbGFsaW5xeGNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1NjIwNDcsImV4cCI6MjEwNzEzODA0N30.lDap2OWhFi3udJQorDmtEKF-WhOt62I8ZLbENQRqaoM';
const GOAT_ORG='c8746565-e4e4-438a-b7a1-2a5ea015e0b3';
const $=id=>document.getElementById(id);
let token=null,user=null;
function clean(){token=null;user=null;sessionStorage.removeItem('goat_crm_session');$('app').classList.add('hidden');$('login').classList.remove('hidden')}
async function api(path,options={}){const res=await fetch(SB_URL+path,{...options,headers:{apikey:SB_ANON,Authorization:'Bearer '+(token||SB_ANON),'Content-Type':'application/json',...(options.headers||{})}});const raw=await res.text();let data;try{data=raw?JSON.parse(raw):null}catch{data=null}if(!res.ok)throw new Error(data?.msg||data?.message||data?.error_description||'Request failed');return data}
async function verify(){const me=await api('/auth/v1/user');if(!me?.id)throw Error('Authentication required');user=me;const memberships=await api('/rest/v1/memberships?select=role&organization_id=eq.'+GOAT_ORG+'&user_id=eq.'+encodeURIComponent(me.id));if(!Array.isArray(memberships)||!memberships.some(m=>['admin','owner','super_admin'].includes(m.role)))throw Error('Your account is not assigned to GOAT Sports CRM.');$('login').classList.add('hidden');$('app').classList.remove('hidden');render('dashboard')}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginError').textContent='';try{const s=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});token=s.access_token;sessionStorage.setItem('goat_crm_session',JSON.stringify({access_token:token,expires_at:Date.now()+((s.expires_in||3600)*1000)}));await verify()}catch(err){clean();$('loginError').textContent=err.message}});
$('signout').addEventListener('click',async()=>{try{await api('/auth/v1/logout',{method:'POST'})}catch{}clean()});
const pages={dashboard:'Dashboard',clients:'Clients',leads:'Leads',quotes:'Quotes',jobs:'Jobs & Production',artwork:'Artwork',employees:'Employees & Tasks',revenue:'Revenue & Tax',locker:'GOAT Locker'};
const details={clients:['Client database','GOAT-specific client management will connect after the organization-scoped API is verified.'],leads:['Lead intake','Connect GOAT website submissions and Monday.com lead records.'],quotes:['Quote management','Connect quote creation, customer approval and revision workflows.'],jobs:['Production workflow','Connect approved quotes, job assignments, production stages and fulfillment.'],artwork:['Artwork management','Connect proofs, approvals, revisions and artwork history.'],employees:['Employee workspace','Connect staff assignments, task notifications and permissions.'],revenue:['Revenue and tax reporting','Reserved for the verified AI Apparel revenue integration. No financial totals are displayed until connected.'],locker:['GOAT Locker integration','Existing customer-facing Locker remains unchanged. Connect only after CRM operations are tested.']};
function render(page){if(!pages[page])page='dashboard';$('pageTitle').textContent=pages[page];document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const view=$('view');if(page==='dashboard'){view.innerHTML='<div class="cards"><div class="card"><span class="muted">CRM organization</span><strong>GOAT</strong><span class="tag">Configured</span></div><div class="card"><span class="muted">Administrator</span><strong>1</strong><span class="tag">Membership assigned</span></div><div class="card"><span class="muted">Revenue sync</span><strong>—</strong><span class="tag warn">Not connected</span></div><div class="card"><span class="muted">Locker sync</span><strong>—</strong><span class="tag warn">Final phase</span></div></div><section class="panel"><h2>GOAT Sports CRM setup</h2><p class="muted">The secure organization workspace is ready for staged integration. Existing GOAT storefront and Locker data have not been migrated or modified.</p><div class="list"><div>✓ GOAT organization registered in Blueprint CRM database</div><div>✓ Administrator membership assigned</div><div>Next: Verify organization-scoped access and connect operational APIs</div><div>Later: Revenue/tax integration and GOAT Locker synchronization</div></div></section>'}else{const [title,description]=details[page];view.innerHTML='<section class="panel"><span class="tag warn">Integration pending</span><h2>'+title+'</h2><p class="muted">'+description+'</p><p class="status">This module is intentionally not connected yet; no demo data is represented as live company records.</p></section>'}}
document.querySelectorAll('.nav').forEach(b=>b.addEventListener('click',()=>render(b.dataset.page)));
try{const s=JSON.parse(sessionStorage.getItem('goat_crm_session')||'null');if(s?.access_token&&s.expires_at>Date.now()){token=s.access_token;verify().catch(()=>clean())}}catch{clean()}
</script></body></html>
