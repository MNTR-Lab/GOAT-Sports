<style>
:root{--purple:#683695;--teal:#109488;--orange:#be5927;--silver:#868e92;--ink:#171925;--bg:#f5f6f9;--line:#e5e7ee}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Arial,Helvetica,sans-serif}button,a{font:inherit}button{cursor:pointer}a{color:var(--purple)}
.shell{max-width:1320px;margin:auto;min-height:100vh}.top{background:white;border-bottom:1px solid var(--line);padding:18px clamp(18px,4vw,48px);display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{display:flex;align-items:center;gap:12px;color:var(--purple);font-size:24px;font-weight:900;letter-spacing:1px}.brand-mark{display:grid;place-items:center;background:var(--purple);color:white;width:42px;height:42px;border-radius:12px;font-size:21px}.topright{display:flex;gap:12px;align-items:center}.eyebrow{font-size:11px;letter-spacing:2px;font-weight:800;color:var(--teal)}
.hero{background:linear-gradient(115deg,#392054,#683695 65%,#109488);color:white;padding:40px clamp(18px,4vw,48px)}.hero .eyebrow{color:#b9f5ed}.hero h1{font-size:clamp(32px,5vw,55px);margin:7px 0}.hero p{max-width:650px;margin:0;color:#eee4f7}
.layout{display:grid;grid-template-columns:230px 1fr;gap:26px;padding:28px clamp(18px,4vw,48px)}.side{display:flex;flex-direction:column;gap:7px}.side button{border:0;text-align:left;padding:13px 15px;border-radius:10px;background:transparent;font-weight:700;color:#535463}.side button.active{background:var(--purple);color:white}.main{min-width:0}
.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:20px;box-shadow:0 6px 24px #17203608}h2{margin:0 0 10px;font-size:25px}h3{margin:0 0 8px}.muted{color:#69717e}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;margin:18px 0}.card{border:1px solid var(--line);background:#fff;border-radius:14px;padding:19px;text-align:left;min-height:145px}.card strong{display:block;font-size:17px;margin:9px 0 5px}.card:hover{border-color:var(--teal)}.pill{display:inline-block;background:#e6f6f3;color:#087b70;padding:5px 9px;border-radius:20px;font-size:11px;font-weight:800}
.primary{border:0;background:var(--purple);color:white;padding:12px 19px;border-radius:10px;font-weight:800}.secondary{background:white;border:1px solid #d4d6dd;border-radius:10px;padding:11px 16px;font-weight:700}.empty{padding:24px;border:1px dashed #cfd4de;border-radius:12px;background:#fafbfc}.hidden{display:none!important}.footer{text-align:center;color:#7b818b;padding:20px;font-size:12px}.notice{border-left:4px solid var(--teal);padding:12px 16px;background:#f0faf8;border-radius:6px;margin-top:14px}.notice.error{border-left-color:var(--orange);background:#fff7f2}.linkrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.mobile-nav{display:none}
@media(max-width:750px){.top{padding:14px 18px}.brand{font-size:18px}.topright .eyebrow{display:none}.hero{padding:30px 20px}.layout{display:block;padding:18px 14px 90px}.side{display:none}.cards{grid-template-columns:1fr}.panel{padding:19px}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;overflow-x:auto;background:white;border-top:1px solid var(--line);padding:7px;z-index:5;gap:4px}.mobile-nav button{flex:1;min-width:65px;border:0;background:white;color:#525466;font-size:11px;font-weight:800;padding:10px 4px;border-radius:7px}.mobile-nav button.active{background:#f0eaf7;color:var(--purple)}}
.brand{gap:10px;letter-spacing:normal}.brand .goat-logo{display:block;width:clamp(170px,24vw,270px);height:auto;max-height:52px;object-fit:contain}.brand .locker-wordmark{color:var(--teal);font-size:clamp(15px,2vw,22px);font-weight:900;white-space:nowrap}.brand-mark{display:none}@media(max-width:750px){.brand .goat-logo{width:clamp(125px,37vw,205px)}.brand .locker-wordmark{font-size:15px}.top{gap:8px}.topright .secondary{padding:8px 10px;font-size:12px}}
.job-list{margin-top:18px;border-top:1px solid var(--line);padding-top:18px}.job-item{border:1px solid var(--line);padding:18px;border-radius:12px;background:#fafbfc;margin:12px 0}.job-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}.job-grid div{display:flex;flex-direction:column;gap:3px}.job-grid strong{font-size:13px}@media(max-width:750px){.job-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

.timeline-header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.timeline-job{border:1px solid var(--line);border-radius:12px;padding:18px;margin:15px 0;background:white}.timeline-track{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;margin:18px 0 12px}.timeline-step{background:#edf0f4;border-radius:8px;padding:10px 5px;text-align:center;color:#69717e;font-size:11px;font-weight:700;min-height:64px;display:flex;align-items:center;justify-content:center}.timeline-step.done{background:#e6f6f3;color:#087b70}.timeline-step.current{background:#683695;color:white}.timeline-step.future{opacity:.72}.timeline-detail{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}.timeline-detail div{background:#f7f8fa;border-radius:8px;padding:10px}.timeline-detail strong{display:block}.timeline-note{font-size:13px;color:#69717e}@media(max-width:750px){.timeline-track{grid-template-columns:repeat(3,minmax(0,1fr))}.timeline-detail{grid-template-columns:1fr}}

.design-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}.design-job{border:1px solid var(--line);border-radius:13px;padding:20px;margin:16px 0;background:#fff}.design-meta{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}.design-meta span{border-radius:7px;background:#f5f6f9;padding:7px 11px;font-size:13px}.proof-area{margin-top:15px;background:#fafbfc;border:1px dashed #cbd2dc;border-radius:11px;padding:17px}.proof-area p{margin:7px 0 0}.proof-files{padding-left:20px;margin:10px 0}.proof-files li{padding:4px 0;overflow-wrap:anywhere}.design-actions{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap}.design-actions button:disabled{opacity:.5;cursor:not-allowed}

.proof-decision-box{margin-top:14px;border:1px solid #dce2e9;background:#f8fafb;border-radius:12px;padding:15px}.proof-decision-box label{display:block;font-weight:800;margin:0 0 7px}.proof-decision-box textarea{width:100%;min-height:100px;border:1px solid #cfd4de;border-radius:9px;padding:12px;font:inherit;resize:vertical}.proof-decision-box .hint{font-size:12px;color:#69717e;margin:8px 0}.proof-decision-box .decision-buttons{display:flex;flex-wrap:wrap;gap:10px}.proof-decision-box .danger{background:#fff;color:#a44824;border:1px solid #cf987e;border-radius:10px;padding:11px 16px;font-weight:800}.proof-decision-box button:disabled{opacity:.5;cursor:wait}.proof-feedback{margin-top:10px;font-size:13px;font-weight:700}.proof-feedback.error{color:#a44824}.proof-feedback.success{color:#087b70}
</style>

function safe(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function b64url(bytes){return btoa(String.fromCharCode(...bytes)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function randomUrlSafe(n=32){const a=new Uint8Array(n);crypto.getRandomValues(a);return b64url(a);}
async function sha256url(s){return b64url(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s))));}
async function customerDiscovery(){
 const [oidc,api]=await Promise.all([fetch('https://www.begoativated.com/.well-known/openid-configuration'),fetch('https://www.begoativated.com/.well-known/customer-account-api')]);
 if(!oidc.ok||!api.ok)throw new Error('Could not connect to GOAT Sports accounts');
 return {...await oidc.json(),...await api.json()};
}
function customerToken(){
 const token=sessionStorage.getItem('goat_customer_access_token');
 const expires=Number(sessionStorage.getItem('goat_customer_token_expires')||0);
 return token&&Date.now()<expires?token:null;
}
async function customerLogin(){
 try{
  lockerError='';
  const cfg=await customerDiscovery();
  const verifier=randomUrlSafe(48),state=randomUrlSafe(24),nonce=randomUrlSafe(24);
  sessionStorage.setItem('goat_pkce_verifier',verifier);
  sessionStorage.setItem('goat_oauth_state',state);
  const u=new URL(cfg.authorization_endpoint);
  for(const [k,v] of Object.entries({scope:CUSTOMER_SCOPE,client_id:CUSTOMER_CLIENT_ID,response_type:'code',redirect_uri:CUSTOMER_REDIRECT_URI,state,nonce,code_challenge:await sha256url(verifier),code_challenge_method:'S256'}))u.searchParams.set(k,v);
  location.assign(u.toString());
 }catch(e){lockerError='Sign-in could not start: '+e.message;render();}
}
async function handleCustomerCallback(){
 const u=new URL(location.href),code=u.searchParams.get('code'),error=u.searchParams.get('error');
 if(!code&&!error)return;
 // Remove sensitive authorization code from the browser address bar.
 history.replaceState({},'',CUSTOMER_REDIRECT_URI);
 if(error){lockerError=u.searchParams.get('error_description')||error;return;}
 const expected=sessionStorage.getItem('goat_oauth_state');
 const verifier=sessionStorage.getItem('goat_pkce_verifier');
 sessionStorage.removeItem('goat_oauth_state');sessionStorage.removeItem('goat_pkce_verifier');
 if(!expected||u.searchParams.get('state')!==expected||!verifier){lockerError='Sign-in security check failed. Please try again.';return;}
 try{
  const cfg=await customerDiscovery();
  const body=new URLSearchParams({grant_type:'authorization_code',client_id:CUSTOMER_CLIENT_ID,redirect_uri:CUSTOMER_REDIRECT_URI,code,code_verifier:verifier});
  const response=await fetch(cfg.token_endpoint,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});
  const result=await response.json();
  if(!response.ok||!result.access_token)throw new Error(result.error_description||result.error||'Token exchange failed');
  sessionStorage.setItem('goat_customer_access_token',result.access_token);
  sessionStorage.setItem('goat_customer_token_expires',String(Date.now()+Number(result.expires_in||3600)*1000));
 }catch(e){lockerError='Sign-in failed: '+e.message;}
}

async function openSecureProof(jobId,assetId,filename,download=false){
 const popup=download?null:window.open('about:blank','_blank');
 try{
  if(!directoryState.selected||!customerToken())throw new Error('Please sign in and choose an organization.');
  const response=await fetch(SUPABASE_URL+'/functions/v1/goat-locker-proof',{
   method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+customerToken(),apikey:SUPABASE_PUBLISHABLE_KEY},
   body:JSON.stringify({organizationId:String(directoryState.selected.mondayItemId),jobId:String(jobId),assetId:String(assetId)})
  });
  if(!response.ok){let info={};try{info=await response.json()}catch{}throw new Error(info.error||'Unable to open proof');}
  const blob=await response.blob();const url=URL.createObjectURL(blob);
  if(download){const a=document.createElement('a');a.href=url;a.download=filename||'proof';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);}
  else if(popup){popup.location.href=url;setTimeout(()=>URL.revokeObjectURL(url),300000);}
  else{URL.revokeObjectURL(url);throw new Error('Please allow pop-ups to preview the proof.');}
 }catch(error){if(popup)popup.close();alert(error.message||'Proof unavailable');}
}

function decisionPanel(job){
 const files=Array.isArray(job.artworkFiles)?job.artworkFiles.filter(f=>/^[0-9]+$/.test(String(f.assetId||''))):[];
 if(!files.length)return '<p class="muted">Attach an artwork file in Monday.com before submitting a proof decision.</p>';

async function submitProofDecision(jobId,decision){
 if(decisionBusy)return;
 const job=jobState.jobs.find(j=>String(j.id)===String(jobId));
 if(!job||!proofDecisionAllowed(job)){alert('This proof is not currently available for approval. Refresh the designs.');return;}
 const selector=document.getElementById('asset-'+jobId);
 const commentInput=document.getElementById('comments-'+jobId);
 const feedback=document.getElementById('feedback-'+jobId);
 const assetId=selector?.value||'';
 const comments=commentInput?.value.trim()||'';
 if(!/^[0-9]+$/.test(assetId)){alert('Select a valid attached proof file.');return;}
 if(decision==='revision'&&(comments.length<3||comments.length>2000)){alert('Please enter revision instructions between 3 and 2000 characters.');commentInput?.focus();return;}
 const selectedName=selector?.selectedOptions?.[0]?.textContent||'the selected proof';
 const confirmation=decision==='approve'?`Approve ${selectedName}? This will update the artwork status in Monday.com.`:`Request revisions to ${selectedName}? Your comments will be saved to the Monday.com job.`;
 if(!confirm(confirmation))return;
 decisionBusy=true;
 document.querySelectorAll('[data-proof-submit]').forEach(b=>b.disabled=true);
 if(feedback){feedback.className='proof-feedback';feedback.textContent='Submitting your decision securely…';}
 try{
  const response=await fetch(SUPABASE_URL+'/functions/v1/goat-locker-proof-decision',{
   method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+customerToken(),apikey:SUPABASE_PUBLISHABLE_KEY},
   body:JSON.stringify({organizationId:String(directoryState.selected.mondayItemId),jobId:String(jobId),assetId:String(assetId),decision,comments})
  });
  const data=await response.json().catch(()=>({}));
  if(!response.ok){if(data.partial){await loadOrganizationJobs();alert(data.error||'The status changed, but the audit update failed. Contact GOAT Sports.');return;}throw new Error(data.error||'The decision could not be recorded.');}
  if(feedback){feedback.className='proof-feedback success';feedback.textContent='Decision saved to Monday.com. Refreshing artwork status…';}
  await loadOrganizationJobs();
  alert(`Proof decision saved: ${data.status||'Success'}. The job has been refreshed.`);
 }catch(error){if(feedback){feedback.className='proof-feedback error';feedback.textContent=error.message||'Unable to submit decision';}alert(error.message||'Unable to submit proof decision');}
 finally{decisionBusy=false;document.querySelectorAll('[data-proof-submit]').forEach(b=>b.disabled=false);}
}

function invoiceDisplayStatus(q){

 if(q.invoice_shopify_status==='invoice_sent'||q.invoice_sent_at)return 'Invoice Sent';
 return quoteStatusLabel(q.status);
}
function quoteStatusLabel(status){
 return ({draft:'Draft',sent_for_review:'Awaiting Customer Approval',sent:'Awaiting Customer Approval',changes_requested:'Changes Requested',approved:'Approved',sync_pending:'Shopify Sync Pending',invoiced:'Invoiced',declined:'Declined'})[status]||String(status||'Unknown').replaceAll('_',' ');
}
function setQuoteHistory(value){quoteHistoryVisible=!!value;render();}

function renderQuotes(){
 if(!customerToken()||!lockerIdentity)return '<div class="panel"><h2>Quotes &amp; Approvals</h2>'+authMessage()+'</div>';
 if(lockerIdentity.adminRole!=='master_admin')return customerQuoteScreen();
 if(String(directoryState.selected?.mondayItemId)!=='13227365382')return '<div class="panel"><h2>Quotes &amp; Approvals</h2><p class="muted">Select MNTR INC on the Dashboard to access the test quote builder.</p></div>';
 const rows=quoteRows.map((r,i)=>`<div class="panel" style="margin:12px 0;padding:14px"><strong>Line item ${i+1}</strong><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:10px 0"><label>Item type<select id="q-source-${i}" onchange="qtypeChange(${i})"><option value="custom" ${r.source==='custom'?'selected':''}>Custom item</option><option value="shopify" ${r.source==='shopify'?'selected':''}>Shopify product variant</option></select></label><label>Description<input id="q-desc-${i}" value="${safe(r.description)}" placeholder="Apparel, decoration or service"></label><label>Quantity<input id="q-qty-${i}" type="number" min="1" step="1" value="${Number(r.quantity)||1}"></label><label>Unit price ($)<input id="q-price-${i}" type="number" min="0" step="0.01" value="${Number(r.unitPrice)||0}"></label><div><label>Search Shopify products<input id="q-search-${i}" placeholder="Search by product name" autocomplete="off"></label><button class="secondary" type="button" onclick="qsearch(${i})">Search products</button><div id="q-results-${i}" style="max-height:250px;overflow:auto"></div><small id="q-picked-${i}">${r.shopifyVariantId?'Shopify variant selected':'Select a product and size, or use Custom item'}</small><input id="q-variant-${i}" type="hidden" value="${safe(r.shopifyVariantId||'')}"></div></div><button class="secondary" type="button" onclick="qremove(${i})">Remove line</button></div>`).join('');
 return `<div class="panel"><div class="eyebrow">MASTER ADMIN · MNTR INC TEST ONLY</div><h2>${revisionSource?"Prepare Revised Quote":"Create Quote Draft"}</h2>${revisionSource?`<div class="notice"><strong>Customer requested changes to quote ${safe(String(revisionSource.id).slice(0,8))}</strong><p>${safe(revisionSource.notes||"No written instructions provided")}</p><p class="muted">Saving creates a replacement draft linked to the original quote. The customer's original feedback is preserved in the records.</p><button class="secondary" onclick="cancelQuoteRevision()">Cancel revision</button></div>`:""}<p class="muted">Job TEST-LOCKER-001. Prepare and save quotes in GOAT Locker. Send a saved draft for customer review before invoicing. Creating or sending a quote does not create a Shopify invoice. Search Shopify products and select a size or color, or enter a custom item. Product IDs are filled in automatically.</p>${rows}<button class="secondary" onclick="qadd()">+ Add line item</button><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:16px 0"><label>Shipping ($)<input id="q-shipping" type="number" min="0" step=".01" value="0"></label><label>Discount ($)<input id="q-discount" type="number" min="0" step=".01" value="0"></label><label>Tax ($)<input id="q-tax" type="number" min="0" step=".01" value="0"></label></div><label>Internal notes<textarea id="q-notes" rows="3" style="display:block;width:100%"></textarea></label><div class="linkrow"><button class="primary" id="q-save" onclick="qsave()">Save quote draft</button><button class="secondary" onclick="qload()">Refresh drafts</button></div></div><div class="panel"><h3>Ready to Invoice (${invoiceReadyQuotes().length})</h3><p class="muted">Approved customer quotes awaiting Shopify order preparation. No invoice is sent automatically.</p>${invoiceReadyQuotes().length?invoiceReadyQuotes().map(q=>`<div style="padding:14px 0;border-bottom:1px solid #ddd"><strong>MNTR INC · TEST-LOCKER-001</strong><p>Quote ${safe(String(q.id).slice(0,8))} · ${safe(q.customer_email||'Customer')} · <strong>$${Number(q.total).toFixed(2)}</strong></p><button class="primary" onclick="reviewInvoiceQueue('${safe(q.id)}')">Review for Shopify Invoice</button></div>`).join(''):'<p class="muted">No approved quotes awaiting invoicing.</p>'}</div><div class="panel"><h3>Quotes</h3><div class="linkrow"><button class="${!quoteHistoryVisible?'primary':'secondary'}" onclick="setQuoteHistory(false)">Active Quotes</button><button class="${quoteHistoryVisible?'primary':'secondary'}" onclick="setQuoteHistory(true)">Shopify Drafts / History</button></div>${quoteState.loading?'<p>Loading…</p>':quoteState.error?'<p class="muted">'+safe(quoteState.error)+'</p>':quoteState.quotes.length?quoteState.quotes.filter(q=>q.status!=='approved'&&(quoteHistoryVisible ? quoteIsHistory(q) : !quoteIsHistory(q))).map(q=>`<div style="padding:12px 0;border-bottom:1px solid #ddd"><strong>${safe(String(q.id).slice(0,8))}</strong> · $${Number(q.total).toFixed(2)} · ${safe(invoiceDisplayStatus(q))} · ${safe(String(q.created_at).slice(0,10))}${q.status==='changes_requested'?`<div class="notice error"><strong>Customer requested changes</strong><p>${safe(q.response_notes||'No instructions provided')}</p><button class="primary" onclick="prepareQuoteRevision('${safe(q.id)}')">Prepare Revised Quote</button></div>`:''}${q.shopify_draft_order_gid?`<p><strong>Shopify Draft Order: ${safe(q.shopify_draft_order_name||q.shopify_draft_order_gid)}</strong> · ${safe(q.invoice_shopify_status==='paid'?'Paid':q.invoice_shopify_status==='invoice_sent'?'Invoice Sent':'Draft Created')}</p><p><button class="secondary" id="q-review-${safe(q.id)}" onclick="qreviewInvoice(\'${safe(q.id)}\')">Review Shopify Invoice</button> <button class="secondary" id="q-sync-${safe(q.id)}" onclick="qsyncInvoiceStatus('${safe(q.id)}')">Refresh Shopify Status</button></p><div id="q-invoice-review-${safe(q.id)}"></div>`:q.status==='draft'?`<p><button class="primary" onclick="sendCustomerQuote('${safe(q.id)}')">Send Quote to Customer</button> <button class="secondary" id="q-shopify-${safe(q.id)}" onclick="qcreateShopify('${safe(q.id)}')">Create Shopify Draft Order</button></p>`:'<p class="muted">'+safe(quoteStatusLabel(q.status))+'</p>'}</div>`).join(''):'<p class="muted">No quotes in this view.</p>'}</div>`;
}

function section(id){const [title,desc]=descriptions[id];return `<div class="panel"><div class="eyebrow">GOAT LOCKER / ${safe(title.toUpperCase())}</div><h2>${safe(title)}</h2><p class="muted">${safe(desc)}</p><div class="empty"><strong>No customer records are connected yet.</strong><p class="muted">This section will show your organization's ${safe(title.toLowerCase())} once the GOAT Sports project database is connected.</p></div>${authMessage()}</div>`;}
function render(){
 renderNav();const el=document.getElementById('content');
 if(active==='dashboard')el.innerHTML=`<div class="panel"><div class="eyebrow">CUSTOMER DASHBOARD</div><h2>Your Organization</h2><p class="muted">Everything related to your GOAT Sports projects, organized in one place.</p>${authMessage()}</div>${adminDirectory()}<div class="cards">${[['designs','D','Designs & Proofs','Artwork, reviews, and approvals'],['timeline','T','Project Timeline','Production and job updates'],['quotes','Q','Quotes','Pricing and approvals'],['orders','O','Orders','Order status and history'],['invoices','$','Invoices','Billing and payments'],['account','A','Account','Organization access']].map(([id,letter,title,desc])=>`<button class="card" onclick="show('${id}')"><span class="pill">${letter}</span><strong>${title}</strong><span class="muted">${desc}</span></button>`).join('')}</div>`;
 else if(active==='account')el.innerHTML=`<div class="panel"><div class="eyebrow">GOAT LOCKER / ACCOUNT</div><h2>Customer Account</h2><p class="muted">Use your existing GOAT Sports account login. GOAT Locker permissions are checked using the same backend as the main GOAT Sports app.</p>${authMessage()}<div class="linkrow"><a class="secondary" href="https://www.begoativated.com/account" target="_blank" rel="noopener noreferrer">Open GOAT Sports customer account ↗</a><a class="secondary" href="https://www.begoativated.com/pages/contact" target="_blank" rel="noopener noreferrer">Contact GOAT Sports ↗</a></div></div>`;
 else if(active==='timeline')el.innerHTML=renderProjectTimeline();
 else if(active==='designs')el.innerHTML=renderDesigns();
 else if(active==='quotes')el.innerHTML=renderQuotes();
 else el.innerHTML=section(active);
}

let autoQuoteRefreshRunning=false;
async function autoLoadQuotes(force=false){
 if(!customerToken()||!lockerIdentity||active!=='quotes'||String(directoryState.selected?.mondayItemId)!=='13227365382')return;
 if(autoQuoteRefreshRunning||(!force&&document.activeElement?.matches('input,textarea,select')))return;
 autoQuoteRefreshRunning=true;
 try{
  if(lockerIdentity.adminRole==='master_admin'){
   if(quoteState.loading)return;
   const data=await qapi({action:'list'});
   quoteState.quotes=Array.isArray(data.quotes)?data.quotes:[];
   quoteState.error='';
  }else{
   if(customerQuotes.loading)return;
   const data=await quoteReviewAPI({action:'list'});
   customerQuotes.quotes=Array.isArray(data.quotes)?data.quotes:[];
   customerQuotes.loaded=true;customerQuotes.error='';
  }
  if(active==='quotes'&&!document.activeElement?.matches('input,textarea,select'))render();
 }catch(e){console.warn('Automatic quote refresh:',e.message);}
 finally{autoQuoteRefreshRunning=false;}
}
function autoLoadJobs(){if(directoryState.selected&&!jobState.loading)loadOrganizationJobs();}
function autoLoadDirectory(){if(lockerIdentity&&!directoryState.loading&&!directoryState.loaded)loadAdminDirectory();}
function autoRefreshCurrent(){
 if(document.hidden||!customerToken()||!lockerIdentity)return;
 if(active==='quotes')autoLoadQuotes();
 else if(active==='timeline')autoLoadJobs();
 else if(active==='dashboard')autoLoadDirectory();
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)autoRefreshCurrent();});
window.addEventListener('focus',()=>autoRefreshCurrent());
setInterval(autoRefreshCurrent,30000);

async function initializeLocker(){
 render();await handleCustomerCallback();
 if(customerToken()&&!lockerError){await loadLockerIdentity();if(lockerIdentity?.adminRole==='master_admin'||lockerIdentity?.organizationAccess?.length)await loadAdminDirectory();}else render();
 if(active==='quotes')autoLoadQuotes(true);
}
initializeLocker();
</script>
<style>
#goat-artwork-overlay[hidden]{display:none!important}#goat-artwork-overlay{position:fixed;inset:0;z-index:10000;background:#171925bd;padding:20px;display:flex;justify-content:center;align-items:center}#goat-artwork-window{background:#f5f6f9;width:min(1100px,100%);max-height:92vh;overflow:auto;border-radius:16px;box-shadow:0 12px 60px #0004}#goat-artwork-top{position:sticky;top:0;background:#683695;color:white;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}#goat-artwork-content{padding:24px}#goat-artwork-content .cards{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}@media(max-width:750px){#goat-artwork-content .cards{grid-template-columns:1fr}}
</style>
<div id="goat-artwork-overlay" hidden><section id="goat-artwork-window" role="dialog" aria-modal="true" aria-label="Client Artwork Library"><div id="goat-artwork-top"><strong>GOAT SPORTS · CLIENT ARTWORK LIBRARY</strong><button class="secondary" onclick="closeGoatArtworkLibrary()">CLOSE ✕</button></div><div id="goat-artwork-content"></div></section></div>
<script>// GOAT Locker master-admin artwork library (uses existing Locker login).
let goatArtworkData=null,goatArtworkSelected=null;
function goatArtworkEsc(x){return safe(x??'');}
async function goatArtworkRequest(action,extra={}){
 const token=customerToken();if(!token)throw Error('Sign in to GOAT Locker first.');
 const response=await fetch(SUPABASE_URL+'/functions/v1/goat-artwork-library',{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_PUBLISHABLE_KEY,'Authorization':'Bearer '+token},body:JSON.stringify({action,...extra})});
 const data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.error||'Artwork library service unavailable');return data;
}
async function openGoatArtworkLibrary(){
 if(lockerIdentity?.adminRole!=='master_admin'){alert('Master admin access is required.');return;}
 const modal=document.getElementById('goat-artwork-overlay');modal.hidden=false;
 document.getElementById('goat-artwork-content').innerHTML='<p>Loading client artwork…</p>';
 try{goatArtworkData=await goatArtworkRequest('list');goatArtworkSelected=null;goatArtworkRender();}
 catch(e){document.getElementById('goat-artwork-content').innerHTML='<div class="notice error"><strong>Could not load artwork library</strong><p>'+goatArtworkEsc(e.message)+'</p><button class="secondary" onclick="openGoatArtworkLibrary()">Retry</button></div>';}
}
function closeGoatArtworkLibrary(){document.getElementById('goat-artwork-overlay').hidden=true;}
function goatArtworkRender(term=''){
 const el=document.getElementById('goat-artwork-content');const clients=Array.isArray(goatArtworkData?.clients)?goatArtworkData.clients:[];
 if(goatArtworkSelected!==null){const client=clients.find(c=>String(c.id)===String(goatArtworkSelected));if(!client){goatArtworkSelected=null;return goatArtworkRender();}
 const jobs=client.jobs||[];
 el.innerHTML='<button class="secondary" onclick="goatArtworkSelected=null;goatArtworkRender()">← All clients</button><h2 style="margin-top:16px">'+goatArtworkEsc(client.name)+'</h2><p class="muted">'+jobs.length+' linked jobs</p>';
 // Build job cards with artwork versions and secure file actions.
 const container=document.createElement('div');
 for(const job of jobs){const card=document.createElement('section');card.className='job-item';const h=document.createElement('h3');h.textContent=(job.jobCode?job.jobCode+' · ':'')+(job.name||'Job');card.appendChild(h);
 const art=Array.isArray(job.artworks)?job.artworks:[];
 if(!art.length){const p=document.createElement('p');p.className='muted';p.textContent='No artwork versions linked to this job.';card.appendChild(p);}
 for(const a of art){const box=document.createElement('div');box.className='design-job';const title=document.createElement('strong');title.textContent=a.title||'Artwork';box.appendChild(title);const meta=document.createElement('p');meta.className='muted';meta.textContent='Version '+(a.version||'—')+' · '+(a.status||'Not set')+(a.uploaded?' · '+a.uploaded:'');box.appendChild(meta);
 for(const f of a.files||[]){const btn=document.createElement('button');btn.className='secondary';btn.style.margin='5px';btn.textContent='Download '+(f.name||'file');btn.onclick=()=>goatArtworkDownload(f.id);box.appendChild(btn);}
 if(a.url&&/^https:\/\//.test(a.url)){const link=document.createElement('a');link.href=a.url;link.target='_blank';link.rel='noopener noreferrer';link.textContent=' Open in Monday.com ↗';box.appendChild(link);}card.appendChild(box);}
 container.appendChild(card);}el.appendChild(container);return;}
 el.innerHTML='<h2>Client Artwork Library</h2><p class="muted">'+clients.length+' CRM clients</p><input id="goat-artwork-search" type="search" placeholder="Search clients or jobs" style="width:100%;padding:13px;border:1px solid #ddd;border-radius:8px;margin:12px 0"><div id="goat-artwork-clients" class="cards"></div>';
 const list=document.getElementById('goat-artwork-clients');const input=document.getElementById('goat-artwork-search');
 function filter(){list.replaceChildren();const q=input.value.toLowerCase().trim();for(const c of clients.filter(c=>String(c.name||'').toLowerCase().includes(q)||String(c.clientId||'').toLowerCase().includes(q)||(c.jobs||[]).some(j=>String(j.name||'').toLowerCase().includes(q)||String(j.jobCode||'').toLowerCase().includes(q)))){const b=document.createElement('button');b.className='card';const strong=document.createElement('strong');strong.textContent=c.name||'Unnamed client';b.appendChild(strong);const p=document.createElement('span');p.className='muted';p.textContent=(c.jobs||[]).length+' jobs · '+(c.artworks||[]).length+' artwork versions';b.appendChild(p);b.onclick=()=>{goatArtworkSelected=String(c.id);goatArtworkRender()};list.appendChild(b);}if(!list.children.length)list.textContent='No matching clients.';}
 input.addEventListener('input',filter);filter();
}
async function goatArtworkDownload(assetId){const popup=window.open('about:blank','_blank');try{const data=await goatArtworkRequest('file',{assetId:String(assetId)});if(!data.url)throw Error('No download URL returned');if(popup)popup.location.href=data.url;else alert('Please allow popups for artwork downloads.');}catch(e){popup?.close();alert(e.message);}}
</script>
