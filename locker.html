<style>
:root{--purple:#683695;--teal:#109488;--orange:#be5927;--silver:#868e92;--ink:#171925;--bg:#f5f6f9;--line:#e5e7ee}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Arial,Helvetica,sans-serif}button,a{font:inherit}button{cursor:pointer}a{color:var(--purple)}
.shell{max-width:1320px;margin:auto;min-height:100vh}.top{background:white;border-bottom:1px solid var(--line);padding:18px clamp(18px,4vw,48px);display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{display:flex;align-items:center;gap:12px;color:var(--purple);font-size:24px;font-weight:900;letter-spacing:1px}.brand-mark{display:grid;place-items:center;background:var(--purple);color:white;width:42px;height:42px;border-radius:12px;font-size:21px}.topright{display:flex;gap:12px;align-items:center}.eyebrow{font-size:11px;letter-spacing:2px;font-weight:800;color:var(--teal)}
.hero{background:linear-gradient(115deg,#392054,#683695 65%,#109488);color:white;padding:40px clamp(18px,4vw,48px)}.hero .eyebrow{color:#b9f5ed}.hero h1{font-size:clamp(32px,5vw,55px);margin:7px 0}.hero p{max-width:650px;margin:0;color:#eee4f7}

.primary{border:0;background:var(--purple);color:white;padding:12px 19px;border-radius:10px;font-weight:800}.secondary{background:white;border:1px solid #d4d6dd;border-radius:10px;padding:11px 16px;font-weight:700}.empty{padding:24px;border:1px dashed #cfd4de;border-radius:12px;background:#fafbfc}.hidden{display:none!important}.footer{text-align:center;color:#7b818b;padding:20px;font-size:12px}.notice{border-left:4px solid var(--teal);padding:12px 16px;background:#f0faf8;border-radius:6px;margin-top:14px}.notice.error{border-left-color:var(--orange);background:#fff7f2}.linkrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.mobile-nav{display:none}
@media(max-width:750px){.top{padding:14px 18px}.brand{font-size:18px}.topright .eyebrow{display:none}.hero{padding:30px 20px}.layout{display:block;padding:18px 14px 90px}.side{display:none}.cards{grid-template-columns:1fr}.panel{padding:19px}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;overflow-x:auto;background:white;border-top:1px solid var(--line);padding:7px;z-index:5;gap:4px}.mobile-nav button{flex:1;min-width:65px;border:0;background:white;color:#525466;font-size:11px;font-weight:800;padding:10px 4px;border-radius:7px}.mobile-nav button.active{background:#f0eaf7;color:var(--purple)}}
.brand{gap:10px;letter-spacing:normal}.brand .goat-logo{display:block;width:clamp(170px,24vw,270px);height:auto;max-height:52px;object-fit:contain}.brand .locker-wordmark{color:var(--teal);font-size:clamp(15px,2vw,22px);font-weight:900;white-space:nowrap}.brand-mark{display:none}@media(max-width:750px){.brand .goat-logo{width:clamp(125px,37vw,205px)}.brand .locker-wordmark{font-size:15px}.top{gap:8px}.topright .secondary{padding:8px 10px;font-size:12px}}
.job-list{margin-top:18px;border-top:1px solid var(--line);padding-top:18px}.job-item{border:1px solid var(--line);padding:18px;border-radius:12px;background:#fafbfc;margin:12px 0}.job-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}.job-grid div{display:flex;flex-direction:column;gap:3px}.job-grid strong{font-size:13px}@media(max-width:750px){.job-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

.timeline-header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.timeline-job{border:1px solid var(--line);border-radius:12px;padding:18px;margin:15px 0;background:white}.timeline-track{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;margin:18px 0 12px}.timeline-step{background:#edf0f4;border-radius:8px;padding:10px 5px;text-align:center;color:#69717e;font-size:11px;font-weight:700;min-height:64px;display:flex;align-items:center;justify-content:center}.timeline-step.done{background:#e6f6f3;color:#087b70}.timeline-step.current{background:#683695;color:white}.timeline-step.future{opacity:.72}.timeline-detail{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}.timeline-detail div{background:#f7f8fa;border-radius:8px;padding:10px}.timeline-detail strong{display:block}.timeline-note{font-size:13px;color:#69717e}@media(max-width:750px){.timeline-track{grid-template-columns:repeat(3,minmax(0,1fr))}.timeline-detail{grid-template-columns:1fr}}

.design-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}.design-job{border:1px solid var(--line);border-radius:13px;padding:20px;margin:16px 0;background:#fff}.design-meta{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}.design-meta span{border-radius:7px;background:#f5f6f9;padding:7px 11px;font-size:13px}.proof-area{margin-top:15px;background:#fafbfc;border:1px dashed #cbd2dc;border-radius:11px;padding:17px}.proof-area p{margin:7px 0 0}.proof-files{padding-left:20px;margin:10px 0}.proof-files li{padding:4px 0;overflow-wrap:anywhere}.design-actions{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap}.design-actions button:disabled{opacity:.5;cursor:not-allowed}

}
function customerToken(){
 const token=sessionStorage.getItem('goat_customer_access_token');
 const expires=Number(sessionStorage.getItem('goat_customer_token_expires')||0);
 return token&&Date.now()<expires?token:null;
}
async function customerLogin(){
 try{
  lockerError='';
  const cfg=await customerDiscovery();
  const verifier=randomUrlSafe(48),state=randomUrlSafe(24),nonce=randomUrlSafe(24);
  sessionStorage.setItem('goat_pkce_verifier',verifier);
  sessionStorage.setItem('goat_oauth_state',state);
  const u=new URL(cfg.authorization_endpoint);
  for(const [k,v] of Object.entries({scope:CUSTOMER_SCOPE,client_id:CUSTOMER_CLIENT_ID,response_type:'code',redirect_uri:CUSTOMER_REDIRECT_URI,state,nonce,code_challenge:await sha256url(verifier),code_challenge_method:'S256'}))u.searchParams.set(k,v);
  location.assign(u.toString());
 }catch(e){lockerError='Sign-in could not start: '+e.message;render();}
}
async function handleCustomerCallback(){
 const u=new URL(location.href),code=u.searchParams.get('code'),error=u.searchParams.get('error');
 if(!code&&!error)return;
 // Remove sensitive authorization code from the browser address bar.
 history.replaceState({},'',CUSTOMER_REDIRECT_URI);
 if(error){lockerError=u.searchParams.get('error_description')||error;return;}
 const expected=sessionStorage.getItem('goat_oauth_state');
 const verifier=sessionStorage.getItem('goat_pkce_verifier');
 sessionStorage.removeItem('goat_oauth_state');sessionStorage.removeItem('goat_pkce_verifier');
 if(!expected||u.searchParams.get('state')!==expected||!verifier){lockerError='Sign-in security check failed. Please try again.';return;}
 try{
  const cfg=await customerDiscovery();
  const body=new URLSearchParams({grant_type:'authorization_code',client_id:CUSTOMER_CLIENT_ID,redirect_uri:CUSTOMER_REDIRECT_URI,code,code_verifier:verifier});
  const response=await fetch(cfg.token_endpoint,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});
  const result=await response.json();
  if(!response.ok||!result.access_token)throw new Error(result.error_description||result.error||'Token exchange failed');
  sessionStorage.setItem('goat_customer_access_token',result.access_token);
  sessionStorage.setItem('goat_customer_token_expires',String(Date.now()+Number(result.expires_in||3600)*1000));
 }catch(e){lockerError='Sign-in failed: '+e.message;}
}
async function loadLockerIdentity(){
 const token=customerToken();
 if(!token){lockerIdentity=null;return;}
 checking=true;render();
 try{
  const response=await fetch(SUPABASE_URL+'/functions/v1/goat-locker-access',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token,apikey:SUPABASE_PUBLISHABLE_KEY},body:JSON.stringify({action:'me'})});
  const data=await response.json();
  if(!response.ok)throw new Error(data.error||'Access verification failed');
  lockerIdentity={adminRole:data.adminRole||null,lockerAccess:Array.isArray(data.lockerAccess)?data.lockerAccess:[]};
  lockerError='';
 }catch(e){lockerIdentity=null;lockerError='Could not verify Locker permissions: '+e.message;}
 finally{checking=false;render();}
}
function lockerSignOut(){
 for(const k of ['goat_customer_access_token','goat_customer_token_expires','goat_pkce_verifier','goat_oauth_state'])sessionStorage.removeItem(k);
 lockerIdentity=null;lockerError='';sessionStorage.removeItem('goat_locker_selected_org');directoryState.selected=null;jobState={loading:false,loaded:false,jobs:[],error:'',organizationId:null};render();
}
let directoryState={loading:false,loaded:false,organizations:[],error:'',selected:null};
let jobState={loading:false,loaded:false,jobs:[],error:'',organizationId:null};
async function loadAdminDirectory(){
 if(lockerIdentity?.adminRole!=='master_admin'||!customerToken())return;
 directoryState.loading=true;directoryState.error='';render();
 try{
  const response=await fetch(SUPABASE_URL+'/functions/v1/goat-locker-directory',{
   method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+customerToken(),apikey:SUPABASE_PUBLISHABLE_KEY},
   body:JSON.stringify({action:'list_test'})
  });
  const data=await response.json();if(!response.ok)throw new Error(data.error||'Could not load organizations');
  directoryState.organizations=Array.isArray(data.organizations)?data.organizations:[];directoryState.loaded=true;
  const savedId=sessionStorage.getItem('goat_locker_selected_org');
  if(savedId&&!directoryState.selected){const saved=directoryState.organizations.find(x=>String(x.mondayItemId)===savedId);if(saved){directoryState.selected=saved;jobState={loading:false,loaded:false,jobs:[],error:'',organizationId:savedId};loadOrganizationJobs();}else{sessionStorage.removeItem('goat_locker_selected_org');}}
 }catch(e){directoryState.error=e.message||'Directory unavailable';}
 finally{directoryState.loading=false;render();}
}
function selectAdminOrganization(id){
 const o=directoryState.organizations.find(x=>String(x.mondayItemId)===String(id));
 if(!o)return;directoryState.selected=o;sessionStorage.setItem('goat_locker_selected_org',String(o.mondayItemId));jobState={loading:false,loaded:false,jobs:[],error:'',organizationId:String(o.mondayItemId)};render();loadOrganizationJobs();
}
async function loadOrganizationJobs(){
 const o=directoryState.selected;
 if(!o||lockerIdentity?.adminRole!=='master_admin'||!customerToken())return;
 const id=String(o.mondayItemId);
 jobState.loading=true;jobState.error='';jobState.organizationId=id;render();
 try{
  const response=await fetch(SUPABASE_URL+'/functions/v1/goat-locker-jobs',{
   method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+customerToken(),apikey:SUPABASE_PUBLISHABLE_KEY},
   body:JSON.stringify({action:'list_test_jobs',organizationId:id})
  });
  const data=await response.json();if(!response.ok)throw new Error(data.error||'Could not load jobs');
  if(directoryState.selected&&String(directoryState.selected.mondayItemId)===id){
   jobState.jobs=Array.isArray(data.jobs)?data.jobs:[];jobState.loaded=true;
  }
 }catch(e){if(directoryState.selected&&String(directoryState.selected.mondayItemId)===id)jobState.error=e.message||'Jobs unavailable';}
 finally{jobState.loading=false;render();}
}
function organizationJobs(){
 const j=jobState;
 if(!directoryState.selected)return '';
 if(j.loading)return '<p class="muted">Loading live jobs from the Jobs Board…</p>';
 if(j.error)return `<div class="notice error"><strong>Jobs connection issue</strong><p>${safe(j.error)}</p><button class="secondary" onclick="loadOrganizationJobs()">Retry jobs</button></div>`;
 if(!j.loaded)return '<button class="secondary" onclick="loadOrganizationJobs()">Load organization jobs</button>';
 if(!j.jobs.length)return '<p class="muted">No linked jobs were found for this organization.</p>';
 return j.jobs.map(x=>`<div class="job-item"><div class="eyebrow">JOB ${safe(x.jobId||x.id)}</div><h3>${safe(x.name)}</h3><div class="job-grid"><div><span class="muted">Job status</span><strong>${safe(x.status||'Not set')}</strong></div><div><span class="muted">Production</span><strong>${safe(x.productionStatus||'Not set')}</strong></div><div><span class="muted">Artwork</span><strong>${safe(x.artworkStatus||'Not set')}</strong></div><div><span class="muted">Quote</span><strong>${safe(x.quoteStatus||'Not set')}</strong></div><div><span class="muted">Payment</span><strong>${safe(x.paymentStatus||'Not set')}</strong></div><div><span class="muted">Target date</span><strong>${safe(x.targetDate||'Not set')}</strong></div></div>${x.customerNotes?`<p><strong>Customer notes:</strong> ${safe(x.customerNotes)}</p>`:''}</div>`).join('');
}
function adminDirectory(){
 if(lockerIdentity?.adminRole!=='master_admin')return '';
 const d=directoryState;
 let contents=d.loading?'<p class="muted">Loading organizations…</p>':d.error?`<div class="notice error"><strong>Directory connection pending</strong><p class="muted">${safe(d.error)}</p><button class="secondary" onclick="loadAdminDirectory()">Retry</button></div>`:d.loaded?d.organizations.length?d.organizations.map(o=>`<div class="admin-org"><div><strong>${safe(o.name)}</strong><div class="muted">Client ID: ${safe(o.clientId||'Not assigned')}</div></div><button class="primary" onclick="selectAdminOrganization('${safe(o.mondayItemId)}')">OPEN LOCKER</button></div>`).join(''):'<p class="muted">MNTR INC was not found in the Client CRM.</p>':'<p class="muted">The first test will load MNTR INC from the existing Client CRM.</p><button class="primary" onclick="loadAdminDirectory()">LOAD TEST ORGANIZATION</button>';
 if(d.selected)contents+=`<div class="notice"><strong>${safe(d.selected.name)} — ${safe(d.selected.clientId||'')}</strong><p class="muted">Organization selected. Jobs are read-only and retrieved from the existing Monday.com Jobs Board.</p><button class="secondary" onclick="directoryState.selected=null;sessionStorage.removeItem('goat_locker_selected_org');render()">Back to directory</button></div><div class="job-list"><h3>Organization Jobs</h3>${organizationJobs()}<div class="linkrow"><button class="secondary" onclick="loadOrganizationJobs()">Refresh jobs</button></div></div>`;
 return `<div class="panel"><div class="eyebrow">MASTER ADMIN / ORGANIZATIONS</div><h2>GOAT Locker Directory</h2><p class="muted">Read-only Client CRM connection · first test: MNTR INC</p>${contents}</div>`;
}
function show(id){if(!tabs.some(t=>t[0]===id))id='dashboard';active=id;render();window.scrollTo({top:0,behavior:'instant'});}
function renderNav(){for(const target of ['side','mobile'])document.getElementById(target).innerHTML=tabs.map(([id,label])=>`<button type="button" class="${id===active?'active':''}" onclick="show('${id}')" aria-current="${id===active?'page':'false'}">${label}</button>`).join('');}
function authMessage(){
 if(lockerError)return `<div class="notice error"><strong>Account connection issue</strong><p class="muted">${safe(lockerError)}</p><button class="secondary" onclick="customerLogin()">Try signing in again</button></div>`;
 if(!customerToken())return `<div class="notice"><strong>Sign in to GOAT Locker</strong><p class="muted">Use your existing GOAT Sports account.</p><button class="primary" onclick="customerLogin()">SIGN IN TO GOAT LOCKER</button></div>`;
 if(checking||!lockerIdentity)return `<div class="notice"><strong>Verifying organization access…</strong><p class="muted">Your account permissions are being checked securely.</p>${checking?'':'<button class="secondary" onclick="loadLockerIdentity()">Retry verification</button>'}</div>`;
 const a=lockerIdentity,admin=a.adminRole?safe(a.adminRole.replace(/_/g,' ').toUpperCase()):'';
 return `<div class="notice"><strong>Signed in${admin?' · '+admin:''}</strong><p class="muted">${a.adminRole?'Administrator access verified.':a.lockerAccess.length?'Organization access verified.':'No Locker organization has been assigned to this account yet.'} Assigned Lockers: ${a.lockerAccess.length}.</p><p class="muted">Your private project records are not connected to this standalone page yet.</p><button class="secondary" onclick="lockerSignOut()">Sign out of this website</button></div>`;
}
const timelineStages=[['New','New'],['Artwork / Design','Design'],['Awaiting Customer','Customer Review'],['Approved','Approved'],['Quoting','Quote'],['Quote Approved','Quote Approved'],['Invoiced','Invoiced'],['Paid','Paid'],['Production','Production'],['Ready / Shipping','Ready / Shipping'],['Completed','Completed']];
function renderProjectTimeline(){
 const selected=directoryState.selected;
 if(!customerToken()||!lockerIdentity)return `<div class="panel"><h2>Project Timeline</h2>${authMessage()}</div>`;
 if(lockerIdentity.adminRole!=='master_admin')return `<div class="panel"><h2>Project Timeline</h2><div class="empty">Your organization timeline will become available after your Locker is assigned.</div></div>`;
 if(!selected)return `<div class="panel"><div class="eyebrow">GOAT LOCKER / PROJECT TIMELINE</div><h2>Project Timeline</h2><p class="muted">Select an organization from the Dashboard to view its live job timeline.</p><button class="primary" onclick="show('dashboard')">Choose organization</button></div>`;
 let html=`<div class="panel"><div class="eyebrow">GOAT LOCKER / PROJECT TIMELINE</div><div class="timeline-header"><div><h2>Project Timeline</h2><p class="muted">${safe(selected.name)} · ${safe(selected.clientId||'')} · Live job status from GOAT Sports Jobs Board</p></div><button class="secondary" onclick="loadOrganizationJobs()">Refresh timeline</button></div>`;
 if(jobState.loading)return html+'<p class="muted">Loading timeline…</p></div>';
 if(jobState.error)return html+`<div class="notice error">${safe(jobState.error)}</div></div>`;
 if(!jobState.loaded)return html+'<button class="primary" onclick="loadOrganizationJobs()">Load timeline</button></div>';
 if(!jobState.jobs.length)return html+'<div class="empty">No jobs with a Job ID are currently linked to this organization.</div></div>';
 for(const j of jobState.jobs){
  const status=String(j.status||'').trim();
  const idx=timelineStages.findIndex(x=>x[0]===status);
  const exceptional=status==='On Hold'||status==='Cancelled';
  const stages=[['New','New'],['Artwork / Design','Design'],['Approved','Approval'],['Quoting','Quote'],['Production','Production'],['Completed','Complete']];
  // Milestone blocks are a simplified visual grouping, not an audit trail.
  const rank={'New':0,'Artwork / Design':1,'Awaiting Customer':1,'Approved':2,'Quoting':3,'Quote Approved':3,'Invoiced':3,'Paid':3,'Production':4,'Ready / Shipping':4,'Completed':5};
  const current=Object.prototype.hasOwnProperty.call(rank,status)?rank[status]:-1;
  html+=`<div class="timeline-job"><div class="eyebrow">JOB ${safe(j.jobId||j.id)}</div><h3>${safe(j.name)}</h3><p><strong>Current status: ${safe(status||'Not set')}</strong>${exceptional?' · Workflow paused or stopped':''}</p><div class="timeline-track">${stages.map((st,i)=>`<div class="timeline-step ${exceptional||current<0?'future':i<current?'done':i===current?'current':'future'}">${safe(st[1])}</div>`).join('')}</div><p class="timeline-note">Timeline reflects the current workflow stage, not confirmed completion dates for earlier milestones.</p><div class="timeline-detail"><div><span class="muted">Artwork status</span><strong>${safe(j.artworkStatus||'Not set')}</strong></div><div><span class="muted">Production status</span><strong>${safe(j.productionStatus||'Not set')}</strong></div><div><span class="muted">Target / in-hand date</span><strong>${safe(j.targetDate||'Not set')}</strong></div><div><span class="muted">Payment status</span><strong>${safe(j.paymentStatus||'Not set')}</strong></div></div></div>`;
 }
 return html+'</div>';
}
function renderDesigns(){
 if(!customerToken()||!lockerIdentity)return `<div class="panel"><h2>Designs &amp; Proofs</h2>${authMessage()}</div>`;
 if(lockerIdentity.adminRole!=='master_admin')return `<div class="panel"><h2>Designs &amp; Proofs</h2><div class="empty">Design access will be available when your organization is assigned and verified.</div></div>`;
 const org=directoryState.selected;
 if(!org)return `<div class="panel"><div class="eyebrow">GOAT LOCKER / DESIGNS &amp; PROOFS</div><h2>Designs &amp; Proofs</h2><p class="muted">Choose an organization on the Dashboard to see its jobs and artwork statuses.</p><button class="primary" onclick="show('dashboard')">Choose organization</button></div>`;
 let out=`<div class="panel"><div class="eyebrow">GOAT LOCKER / DESIGNS &amp; PROOFS</div><div class="design-head"><div><h2>Designs &amp; Proofs</h2><p class="muted">${safe(org.name)} · ${safe(org.clientId||'')} · Current artwork status from GOAT Sports Jobs Board</p></div><button class="secondary" onclick="loadOrganizationJobs()">Refresh designs</button></div>`;
 if(jobState.loading)return out+'<p class="muted">Loading jobs and artwork statuses…</p></div>';
 if(jobState.error)return out+`<div class="notice error">${safe(jobState.error)}</div></div>`;
 if(!jobState.loaded)return out+'<button class="primary" onclick="loadOrganizationJobs()">Load designs</button></div>';
 if(!jobState.jobs.length)return out+'<div class="empty">No linked jobs with Job IDs were found for this organization.</div></div>';
 for(const j of jobState.jobs){
  const artwork=String(j.artworkStatus||'Not set');
  out+=`<article class="design-job"><div class="eyebrow">JOB ${safe(j.jobId||j.id)}</div><h3>${safe(j.name)}</h3><div class="design-meta"><span><strong>Artwork:</strong> ${safe(artwork)}</span><span><strong>Job:</strong> ${safe(j.status||'Not set')}</span></div><div class="proof-area"><strong>Artwork &amp; proof files</strong>${Array.isArray(j.artworkFiles)&&j.artworkFiles.length?`<p class="muted">${j.artworkFiles.length} file(s) attached in Monday.com:</p><ul class="proof-files">${j.artworkFiles.map(f=>`<li><span aria-hidden="true">📎</span> ${safe(f.name)}</li>`).join('')}</ul><p class="muted">File previews and downloads will be enabled after secure file access is verified.</p>`:'<p class="muted">No artwork or proof files are attached to this job in Monday.com.</p>'}</div><div class="design-actions"><button class="secondary" disabled title="Available after secure proof access is connected">Request revision — coming soon</button><button class="primary" disabled title="Available after secure proof access is connected">Approve proof — coming soon</button></div></article>`;
 }
 return out+'<p class="muted">Read-only test: artwork statuses and attached filenames are retrieved from Monday.com. Secure file downloads and approval actions are not enabled yet.</p></div>';
}
function section(id){const [title,desc]=descriptions[id];return `<div class="panel"><div class="eyebrow">GOAT LOCKER / ${safe(title.toUpperCase())}</div><h2>${safe(title)}</h2><p class="muted">${safe(desc)}</p><div class="empty"><strong>No customer records are connected yet.</strong><p class="muted">This section will show your organization's ${safe(title.toLowerCase())} once the GOAT Sports project database is connected.</p></div>${authMessage()}</div>`;}
function render(){
 renderNav();const el=document.getElementById('content');
 if(active==='dashboard')el.innerHTML=`<div class="panel"><div class="eyebrow">CUSTOMER DASHBOARD</div><h2>Your Organization</h2><p class="muted">Everything related to your GOAT Sports projects, organized in one place.</p>${authMessage()}</div>${adminDirectory()}<div class="cards">${[['designs','D','Designs & Proofs','Artwork, reviews, and approvals'],['timeline','T','Project Timeline','Production and job updates'],['quotes','Q','Quotes','Pricing and approvals'],['orders','O','Orders','Order status and history'],['invoices','$','Invoices','Billing and payments'],['account','A','Account','Organization access']].map(([id,letter,title,desc])=>`<button class="card" onclick="show('${id}')"><span class="pill">${letter}</span><strong>${title}</strong><span class="muted">${desc}</span></button>`).join('')}</div>`;
 else if(active==='account')el.innerHTML=`<div class="panel"><div class="eyebrow">GOAT LOCKER / ACCOUNT</div><h2>Customer Account</h2><p class="muted">Use your existing GOAT Sports account login. GOAT Locker permissions are checked using the same backend as the main GOAT Sports app.</p>${authMessage()}<div class="linkrow"><a class="secondary" href="https://www.begoativated.com/account" target="_blank" rel="noopener noreferrer">Open GOAT Sports customer account ↗</a><a class="secondary" href="https://www.begoativated.com/pages/contact" target="_blank" rel="noopener noreferrer">Contact GOAT Sports ↗</a></div></div>`;
 else if(active==='timeline')el.innerHTML=renderProjectTimeline();
 else if(active==='designs')el.innerHTML=renderDesigns();
 else el.innerHTML=section(active);
}
async function initializeLocker(){
 render();await handleCustomerCallback();
 if(customerToken()&&!lockerError){await loadLockerIdentity();if(lockerIdentity?.adminRole==='master_admin')await loadAdminDirectory();}else render();
}
initializeLocker();
</script>
</body>
