<!doctype html><html lang="en"><meta charset="utf-8"><title>GOAT Locker — Approval Update Installer</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:16px/1.6 Arial;background:#f5f6f9;color:#202030;max-width:680px;margin:60px auto;padding:20px}main{background:white;padding:30px;border-radius:14px;border:1px solid #ddd}h1{color:#683695}button{background:#683695;color:white;padding:12px 20px;border:0;border-radius:7px;cursor:pointer}input{margin:15px 0}#status{margin-top:15px}</style><main><h1>GOAT Sports / Locker</h1><h2>Artwork Approval Installer</h2><p>Choose your existing <strong>locker.html</strong> file. This installer adds the Approve Proof and Request Revision controls without changing your login, branding, jobs, timeline, or proof preview/download.</p><input id="file" type="file" accept=".html,text/html"><br><button id="run">Create Updated locker.html</button><p id="status"></p></main><script>
const fn=`async function submitProofDecision(jobId,assetId,decision){
 const job=jobState.jobs.find(j=>String(j.id)===String(jobId));
 if(!job||String(job.artworkStatus)!=='Sent for Review'){alert('Set Artwork Status to Sent for Review in Monday.com before submitting a decision.');return;}
 const comments=decision==='revision'?prompt('Describe the requested artwork changes (required):'):'';
 if(decision==='revision'&&comments===null)return;

 if(decision==='approve'&&!confirm('Approve this exact proof? This will change Artwork Status to Approved in Monday.com.'))return;
 try{
  const response=await fetch(SUPABASE_URL+'/functions/v1/goat-locker-proof-decision',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+customerToken(),apikey:SUPABASE_PUBLISHABLE_KEY},body:JSON.stringify({organizationId:String(directoryState.selected.mondayItemId),jobId:String(jobId),assetId:String(assetId),decision,comments:comments||''})});
  const result=await response.json();if(!response.ok)throw new Error(result.error||'Could not record decision');
  alert('Proof decision recorded in Monday.com: '+result.status);
  await loadOrganizationJobs();
 }catch(e){alert(e.message||'Could not submit proof decision');}
}
`;
document.getElementById('run').onclick=async()=>{const status=document.getElementById('status');try{const file=document.getElementById('file').files[0];if(!file)throw Error('Choose your locker.html file first.');let s=await file.text();if(s.includes('async function submitProofDecision('))throw Error('This file already has the approval update.');if(!s.includes('function renderDesigns(){')||!s.includes('openSecureProof('))throw Error('This is not the expected GOAT Locker version. No changes made.');s=s.replace('function renderDesigns(){',fn+'function renderDesigns(){');const target='</button>`:\'\'}</li>`';const addition='</button> ${artwork===\'Sent for Review\'?`<button class="primary" onclick="submitProofDecision(\'${safe(j.id)}\',\'${safe(f.assetId)}\',\'approve\')">Approve proof</button> <button class="secondary" onclick="submitProofDecision(\'${safe(j.id)}\',\'${safe(f.assetId)}\',\'revision\')">Request revision</button>`:\'\'}`:\'\'}</li>`';if(!s.includes(target))throw Error('Could not locate the proof file buttons. No changes made.');s=s.replace(target,addition);s=s.replace('<div class="design-actions"><button class="secondary" disabled title="Available after secure proof access is connected">Request revision — coming soon</button><button class="primary" disabled title="Available after secure proof access is connected">Approve proof — coming soon</button></div>','<p class="muted">Proof decisions are available beside each file when Artwork Status is Sent for Review.</p>');s=s.replace('Read-only test: artwork statuses and attached filenames are retrieved from Monday.com. Proof previews and downloads are restricted to the MNTR INC admin test. Approval actions are not enabled yet.','MNTR INC admin test: proof approvals and revision requests update Artwork Status and add a dated Monday.com job update.');const blob=new Blob([s],{type:'text/html'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='locker.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);status.textContent='Updated locker.html created. Upload this file to GitHub.';}catch(e){status.textContent='Could not update: '+e.message;}};
